name: Nexora uptime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check public health endpoint
        env:
          NEXORA_HEALTH_URL: ${{ secrets.NEXORA_HEALTH_URL }}
        run: |
          test -n "$NEXORA_HEALTH_URL"
          curl --fail --silent --show-error --max-time 20 "$NEXORA_HEALTH_URL/api/health"
